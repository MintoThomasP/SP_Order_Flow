# /etc/nginx/sites-available/silverpoint
# SilverPoint POD - Production Nginx Reverse Proxy Configuration

server {
    listen 80;
    server_name orderflow.silverpointprint.com;

    # Maximum upload size for print-ready PDFs and artwork assets
    client_max_body_size 64M;

    # Performance & Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Django Static Files (collected via python manage.py collectstatic)
    location /static/ {
        alias /var/www/SP_Order_Flow/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # User Media Uploads
    location /media/ {
        alias /var/www/SP_Order_Flow/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django Backend REST API & Admin
    location ~ ^/(api|admin|peecho)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Next.js Frontend Application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
