# /etc/nginx/sites-available/orderflow.silverpointprint.com
# Unified Reverse Proxy for orderflow (orderflow.silverpointprint.com & staging-orderflow.silverpointprint.com)

upstream orderflow_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream orderflow_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name orderflow.silverpointprint.com staging-orderflow.silverpointprint.com;

    client_max_body_size 64M;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Django Static Assets
    location /static/ {
        alias /var/www/SP_Order_Flow/backend/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django Media / Uploads
    location /media/ {
        alias /var/www/SP_Order_Flow/backend/media/;
        expires 7d;
        access_log off;
    }

    # Django REST Framework, Admin & Peecho Webhooks
    location ~ ^/(api|admin|peecho)/ {
        proxy_pass http://orderflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Next.js Frontend Application
    location / {
        proxy_pass http://orderflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
